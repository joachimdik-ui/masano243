name: Update international match history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-international-results.yml"
      - "scripts/update-international-results.js"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh international results
        run: node scripts/update-international-results.js
      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/international-results.json
          if git diff --cached --quiet; then
            echo "International results are already up to date."
          else
            git commit -m "Met à jour les résultats internationaux"
            git push
          fi
