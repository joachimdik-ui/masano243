}

const SECS={home:["Accueil","home"],news:["Actus","news",[["articles","Articles"],["flash","Flash infos"]]],match:["Matchs","ball",[["L1","Ligue 1"],["L2","Ligue 2"],["EPF","EPF-KIN"],["AUT","Autres matchs"]]],
  team:["Équipes","shield",[["lc","Clubs Linafoot"],["lb","Buteurs Linafoot"],["lr","Classements"],["ec","Clubs EPF-KIN"],["es","Buteurs EPF-KIN"],["er","Classement EPF-KIN"]]],
  sport:["Sports","grid",[["bk","Basketball"],["ju","Judo"],["om","Omnisports"]]]};
const cur=()=>sub[sec]||SECS[sec][2]?.[0][0];
const gen=k=>({t:R[k].t,o:R[k].o,open:r=>R[k].ro?0:form(R[k],r),add:R[k].ro?null:()=>form(R[k]),row:R[k].mt?mRow:r=>rowWithLogo(r,k),raw:!R[k].mt});

function rowWithLogo(r,k) {
  let logoUrl = r.logo_url || "";
  if (!logoUrl && (k === "lb" || k === "es")) logoUrl = clogo(r.club_id);
  const titleText = esc(R[k].ti(r));
  const subText = esc(R[k].su(r));
  const isClub = k === "lc" || k === "ec";
  const isScorer = k === "lb" || k === "es";
  const mark = isClub || isScorer
    ? clubMark(isScorer ? cshort(r.club_id,cn(r.club_id)) : (r.sigle||r.nom),logoUrl)
    : logoUrl ? `<img src="${esc(logoUrl)}" class="club-row-logo" alt="">` : "";
  const heading = isScorer
    ? `<div class="scorer-row-heading"><b>${titleText}</b><span class="scorer-goals" aria-label="${esc(r.buts??0)} buts marqués">${esc(r.buts??0)}</span></div>`
    : `<b>${titleText}</b>`;
  return `${mark}<div>${heading}<small>${subText}</small></div>`;
}

const mRow=r=>{
  const dName = esc(mn(r,"domicile"));
  const vName = esc(mn(r,"visiteur"));
  const dLogo = mlogo(r, "domicile");
  const vLogo = mlogo(r, "visiteur");
  return `<div><div class="mt"><span>${clubMark(cshort(r.club_domicile_id,mn(r,"domicile")),dLogo)}<b>${dName}</b></span><b>${r.score_domicile??"–"} : ${r.score_visiteur??"–"}</b><span><b>${vName}</b>${clubMark(cshort(r.club_visiteur_id,mn(r,"visiteur")),vLogo)}</span></div><small>${r.statut==="live"?'<span class="live">● En direct</span>':esc((ST.find(s=>s[0]===r.statut)||[0,r.statut])[1])} · ${fmt(r.date_match)}${r.ligue?" · "+esc(r.ligue+" "+(r.groupe||"")):r.serie?" · Série "+esc(r.serie):r.competition?" · "+esc(r.competition):""}</small></div>`;
};

function V(){const s=cur();
  if(sec==="news")return s==="flash"?{t:"flash",o:["id",0],open:flashForm,add:()=>flashForm(),row:r=>`<div><b style="white-space:normal">${esc(r.info)}</b></div>`}
    :{t:"articles",o:["created_at",0],open:articleForm,add:()=>articleForm(),row:r=>`${r.photo_1?`<img src="${esc(r.photo_1)}" alt="">`:'<span class="nb"></span>'}<div><b>${esc(r.titre)}</b><small>${esc(r.categorie||"")} · ${fmt(r.created_at)}</small></div>`};
  if(sec==="match"){if(s==="EPF"){const g=gen("em");return{...g,row:mRow}}
    if(s==="AUT"){const g=gen("ma");return{...g,flt:q=>q.is("ligue",null)}}
    return{t:"matchs",o:["date_match",0],flt:q=>q.eq("ligue",s),open:matchForm,add:()=>matchForm({ligue:s}),row:mRow}}
  return gen(s)}
async function load(){
  const L=$("#list");if(sec==="home")return dash(L);
  const v=V();$("#fab").hidden=!v.add;
  L.innerHTML=(SECS[sec][2]?`<div class="pills">${SECS[sec][2].map(([k,l])=>`<button class="pill${k===cur()?" on":""}" data-s="${k}">${l}</button>`).join("")}</div>`:"")+'<div id="rl"><p class="mu">Chargement…</p></div>';
  $$(".pill").forEach(b=>b.onclick=()=>{sub[sec]=b.dataset.s;load()});
  let q=sb.from(v.t).select("*");if(v.flt)q=v.flt(q);const{data,error}=await q.order(v.o[0],{ascending:!!v.o[1]}).limit(100);
  if(error){$("#fab").hidden=true;$("#rl").innerHTML=miss(error)?`<div class="note"><b>Bientôt disponible</b><p>Cette rubrique est prête dans l’admin, mais la table <code>${v.t}</code> n’existe pas encore dans la base.</p></div>`:`<p class="err">${esc(error.message)}</p>`;return}
  rows=data;if(!rows.length){$("#rl").innerHTML='<p class="mu">Rien pour le moment.'+(v.add?" Touchez le bouton d'ajout pour commencer.":"")+"</p>";return}
  $("#rl").innerHTML=rows.map((r,i)=>`<button class="row" data-i="${i}">${v.row(r)}</button>`).join("");
  if(v.open)$$("#rl .row").forEach(b=>b.onclick=()=>v.open(rows[+b.dataset.i]));
}
async function dash(L){
  $("#fab").hidden=true;
  L.innerHTML='<p class="mu">Chargement…</p>';
  const cnt=async t=>{try{const{count}=await sb.from(t).select("*",{count:"exact",head:true});return count??"–"}catch{return"–"}};
  const[lv,ev,...c]=await Promise.all([sb.from("matchs").select("*").eq("statut","live").limit(1),sb.from("epf_kin_matches").select("*").eq("statut","live").limit(1),...["articles","matchs","clubs","buteurs","epf_kin_matches","epf_kin_clubs"].map(cnt)]);
  const lm=lv.data?.[0]||ev.data?.[0],isE=!lv.data?.[0]&&!!lm;
  const dName = lm ? esc(mn(lm,"domicile")) : "";
  const vName = lm ? esc(mn(lm,"visiteur")) : "";
  const dLogo = lm ? mlogo(lm, "domicile") : "";
  const vLogo = lm ? mlogo(lm, "visiteur") : "";
  const tiles=[["Articles",c[0],"news","articles","news"],["Matchs Linafoot",c[1],"match","L1","ball"],["Clubs Linafoot",c[2],"team","lc","shield"],["Buteurs Linafoot",c[3],"team","lb","grid"],["Matchs EPF-KIN",c[4],"match","EPF","ball"],["Clubs EPF-KIN",c[5],"team","ec","shield"]];
  const today=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  L.innerHTML=`<section class="dashboard-hero">
      <div class="dashboard-hero-copy"><span class="dashboard-eyebrow">Masano243 · Espace rédaction</span><h1>Le sport, en direct.<span>Votre rédaction, en action.</span></h1><p>Bonjour ${esc(me.nom)}. Retrouvez vos contenus, vos clubs et vos rencontres au même endroit.</p></div>
      <div class="dashboard-match">
        <div class="dashboard-match-heading"><strong>${lm?"Le match à suivre":"À vous de jouer"}</strong><span class="dashboard-live-pill${lm?"":" is-idle"}">${lm?"En direct":"Centre de commande"}</span></div>
        ${lm?`<div class="dashboard-score"><div class="dashboard-team">${clubMark(cshort(lm.club_domicile_id,mn(lm,"domicile")),dLogo)}<b>${dName}</b></div><strong>${lm.score_domicile??0} : ${lm.score_visiteur??0}</strong><div class="dashboard-team">${clubMark(cshort(lm.club_visiteur_id,mn(lm,"visiteur")),vLogo)}<b>${vName}</b></div></div><small>${esc(lm.competition||"EPF-KIN")}</small><button class="dashboard-action" id="hm">${ic("ball")} Mettre à jour le match</button>`
          :`<div class="dashboard-score"><div class="dashboard-team"><span class="tile-icon">${ic("ball")}</span><b>Votre prochain match</b></div><strong>—</strong><div class="dashboard-team"><span class="tile-icon">${ic("news")}</span><b>Votre prochaine actu</b></div></div><small>Tout est prêt pour couvrir l’actualité sportive.</small><button class="dashboard-action" id="hn">${ic("plus")} Programmer un match</button>`}
      </div>
    </section>
    <div class="dashboard-section-heading"><div><h2>Vue d’ensemble</h2><p>Vos contenus et compétitions en un coup d’œil.</p></div><span>${esc(today)}</span></div>
    <div class="tiles">${tiles.map((t,i)=>`<button class="tile" data-i="${i}"><span class="tile-icon">${ic(t[4])}</span><b>${t[1]}</b><span>${t[0]}</span></button>`).join("")}</div>`;
  $$(".tile").forEach(b=>b.onclick=()=>{const t=tiles[+b.dataset.i];go(t[2],t[3])});
  if(lm)$("#hm").onclick=()=>isE?form(R.em,lm):matchForm(lm);else $("#hn").onclick=()=>go("match","L1");
}
function go(s,p){sec=s;if(p)sub[s]=p;shell();load()}
function shell(){
  const d=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  $("#app").innerHTML=`<header><span class="av">${esc(me.nom[0]?.toUpperCase())}</span><div class="who"><b>${sec==="home"?"Bonjour, "+esc(me.nom):SECS[sec][0]}</b><small>${d}</small></div><button class="ib" id="rf" aria-label="Actualiser">${ic("ref")}</button><button class="ib" id="out" aria-label="Quitter">${ic("out")}</button></header><main id="list"></main><button class="fab" id="fab" aria-label="Ajouter">${ic("plus")}</button><nav class="tabs" aria-label="Navigation admin">${Object.entries(SECS).map(([k,[l,i]])=>`<button data-t="${k}" class="${k===sec?"on":""}">${ic(i)}${l}</button>`).join("")}</nav>`;
  $("#fab").onclick=()=>V().add?.();$("#rf").onclick=()=>boot();$("#out").onclick=async()=>{await sb.auth.signOut();loginView()};
  $$(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function loginView(msg=""){
  $("#app").innerHTML=`<div class="lgn"><div class="top"><img src="${LOGO}" alt="Masano243"><h1>Espace rédaction</h1><div style="opacity:.8">Connectez-vous pour gérer le site</div></div><form class="login" id="lf"><label>Identifiant</label><input id="u" autocomplete="username" autocapitalize="none" required><label>Mot de passe</label><input id="p" type="password" autocomplete="current-password" required><p class="err" id="le">${esc(msg)}</p><button class="btn pri" style="width:100%">${ic("plus")} Se connecter</button></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const u=$("#u").value.trim();
    const{error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:u+"@masano243.net",password:$("#p").value});
    if(error)$("#le").textContent="Identifiant ou mot de passe incorrect.";else boot()};
}
async function boot(){
  const{data:{session}}=await sb.auth.getSession();if(!session)return loginView();
  const{data:ok}=await sb.rpc("is_admin");
  if(!ok){await sb.auth.signOut();return loginView("Ce compte n’a pas les droits d’administration.")}
  me={nom:session.user.user_metadata?.nom||session.user.email.split("@")[0]};
  const[a,b]=await Promise.all([sb.from("clubs").select("id,nom,ligue,groupe,logo_url").order("nom"),sb.from("epf_kin_clubs").select("id,nom,serie,logo_url").order("nom")]);
  clubs=a.data||[];eclubs=b.data||[];shell();load();
}
boot();
</script></body></html>
